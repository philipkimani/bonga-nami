<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Widget Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 2rem;
    }
    
    .container {
      text-align: center;
      max-width: 600px;
    }
    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    
    p {
      font-size: 1.125rem;
      opacity: 0.9;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
    }
    
    .feature {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.1);
      border-radius: 2rem;
      font-size: 0.875rem;
    }
    
    .powered-by {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      opacity: 0.7;
    }
    
    .powered-by a {
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 AI Assistant Demo</h1>
    <p>
      Click the chat button in the bottom-right corner to start a conversation.
      This widget uses ElevenLabs Conversational AI and is fully customizable.
    </p>
    
    <div class="features">
      <div class="feature">💬 Text Chat</div>
      <div class="feature">🎤 Voice Input</div>
      <div class="feature">⚡ Real-time</div>
      <div class="feature">🔒 Secure</div>
    </div>
  </div>
  
  <div class="powered-by">
    <span>Bonga Nami</span>
  </div>
  
  <!-- Widget mount point -->
  <div id="bonga-nami-chat-widget"></div>
  
  <!-- Widget bundle (built from WidgetApp.tsx) -->
  <script type="module" src="/widget/bundle.js"></script>
</body>
</html>
